<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KAYTESS - Healthcare Staffing</title>
    <meta name="description" content="KAYTESS Healthcare Staffing Platform - Connecting nurses with healthcare facilities">
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #1e40af;
            color: white;
            margin: 0;
            padding: 20px;
            text-align: center;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .logo {
            width: 120px;
            height: 120px;
            background: white;
            border-radius: 20px;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            color: #1e40af;
            font-weight: bold;
        }
        h1 {
            font-size: 2.5rem;
            margin: 20px 0;
        }
        p {
            font-size: 1.2rem;
            opacity: 0.9;
            max-width: 600px;
            margin: 0 auto 30px;
        }
        .redirect-notice {
            background: rgba(255,255,255,0.1);
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
        }
        a {
            color: white;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="logo">🏥</div>
    <h1>KAYTESS</h1>
    <p>Healthcare Staffing Platform</p>
    
    <div class="redirect-notice">
        <h3>Mobile App Test Version</h3>
        <p>This is a test build of the KAYTESS mobile application.</p>
        <p>The full application requires backend connectivity.</p>
        <p>For complete functionality, access the web version at your deployment URL.</p>
    </div>

    <script>
        // Basic mobile app detection and functionality
        if (window.Capacitor) {
            console.log('Running in Capacitor mobile app');
            document.querySelector('.redirect-notice').innerHTML = 
                '<h3>Mobile App Ready</h3><p>This is the KAYTESS mobile application. Backend connectivity required for full functionality.</p>';
        }
        
        // Add some basic mobile app behavior
        document.addEventListener('deviceready', function() {
            console.log('Device ready');
        });
    </script>
</body>
</html>
