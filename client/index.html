<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>KAYTESS - Healthcare Staffing Platform</title>
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json">
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#2563eb">
    <meta name="background-color" content="#ffffff">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="KAYTESS">
    <meta name="description" content="Comprehensive healthcare staffing platform optimizing workforce allocation and nurse engagement">
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.ico">
    
    <!-- PWA Icons -->
    <link rel="icon" type="image/svg+xml" sizes="32x32" href="/icons/icon-32x32.svg">
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.svg">
    <link rel="mask-icon" href="/icons/icon-32x32.svg" color="#2563eb">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          // Try to register service worker with proper path handling
          const swPath = window.location.hostname === 'localhost' || window.location.hostname.includes('replit') 
            ? '/sw.js' 
            : '/sw.js';
          
          navigator.serviceWorker.register(swPath)
            .then((registration) => {
              console.log('SW registered successfully: ', registration);
            })
            .catch((registrationError) => {
              console.log('SW registration failed: ', registrationError);
              // Fallback: try without service worker for development
              console.log('App will continue without offline functionality');
            });
        });
      }
    </script>
    
    <!-- This is a replit script which adds a banner on the top of the page when opened in development mode outside the replit environment -->
    <script type="text/javascript" src="https://replit.com/public/js/replit-dev-banner.js"></script>
  </body>
</html>
